syntax = "proto3";

package structs.structs;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "structs/x/structs/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "structs/x/structs/Params";
  option (gogoproto.equal) = true;

  // guildCharterDifficultyRange is the block count at which the guild charter
  // proof-of-work bottoms out at one leading zero. Must be at least 2:
  // CalculateDifficulty divides by log10(range), so 1 divides by zero and 0
  // yields negative infinity.
  uint64 guildCharterDifficultyRange = 1;

  // guildCharterReactorAge is how many blocks after creation a reactor becomes
  // eligible to found one guild without solving the puzzle.
  uint64 guildCharterReactorAge = 2;
  // Admission limit for validator inflows, in basis points (1..10000).
  uint64 reactorStakeCapBps = 3;
  // Sticky cap activation threshold, evaluated after validator-set updates.
  uint64 reactorStakeCapMinValidators = 4;
  // Diversity pricing changes require an upgrade rebuilding derived power.
  uint64 diversityMaxBonusBps = 5;
  uint64 diversityTargetExtraReactors = 6;
}
