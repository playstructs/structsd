syntax = "proto3";


package structs.structs;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "structs/structs/params.proto";
import "google/protobuf/timestamp.proto";
import "cosmos/staking/v1beta1/staking.proto";

import "structs/structs/address.proto";
import "structs/structs/agreement.proto";
import "structs/structs/allocation.proto";
import "structs/structs/fleet.proto";
import "structs/structs/grid.proto";
import "structs/structs/guild.proto";
import "structs/structs/infusion.proto";
import "structs/structs/keys.proto";
import "structs/structs/permission.proto";
import "structs/structs/player.proto";
import "structs/structs/planet.proto";
import "structs/structs/provider.proto";
import "structs/structs/reactor.proto";
import "structs/structs/reactor_diversity.proto";
import "structs/structs/struct.proto";
import "structs/structs/substation.proto";
import "structs/structs/vault_vesting.proto";

option go_package = "structs/x/structs/types";

// Replace this owner's current applied diversity accounting. A zero row clears
// the previous value, including when its empty summary is removed from storage.
message EventOwnerReactorDiversity {
  OwnerReactorDiversity diversity = 1;
}
// Genesis replay replaces the entire derived owner-diversity projection.
message EventOwnerReactorDiversityReset {}





// Begin complete replacement of indexed commission-repair revisions during
// genesis replay or upgrade. Clear prior revisions; reactors absent from the
// following EventReactorCommissionRevision rows have the initial 0/0 state.
// Consume the reset and subsequent rows in block event order, atomically.
message EventReactorCommissionRevisionReset {}

// Replace one reactor's slash-repair revisions, not its power or validator
// health. Unequal revisions gate commission admission. Equality only removes
// that gate. Manual restart never advances slashRevision.
message EventReactorCommissionRevision {
  string reactorId = 1;
  uint64 slashRevision = 2;
  uint64 reconciledSlashRevision = 3;
}

// Source accounts retain their BaseAccount identity and become ordinary accounts.
// The complete destination schedules/counters allow indexers to preserve locks.
message EventVaultVestingMigration {
  VaultVestingAccount vault = 1;
  repeated string source_addresses = 2;
}

message EventGuildRankPurchase {
  string guildId = 1;
  string playerId = 2;
  uint64 previousRank = 3;
  uint64 rank = 4;
  uint64 price = 5;
  string denom = 6;
  bool joined = 7;
}


/*
 * These all take the form of Container{ Object{} } rather than
 * using Object{ attrA: "val", attrB: "lav"} so that when they
 * are added to the database as an index record, it ads a single
 * json blob for the object, rather than one line per attribute.
 *
 * The only time Object{} should be used as an event without a
 * container, is when there is only a single attribute in
 * the results, such as EventDelete{ string objectId = 1; }
 */

  message EventAllocation       { Allocation allocation = 1; }
  message EventAgreement        { Agreement agreement = 1; }
  message EventFleet            { Fleet fleet = 1; }
  message EventGuild            { Guild guild = 1; }
  message EventInfusion         { Infusion infusion = 1; }
  message EventPlanet           { Planet planet = 1; }
  message EventPlanetAttribute  { PlanetAttributeRecord planetAttributeRecord = 1; }
  message EventPlayer           { Player player = 1; }
  message EventProvider         { Provider provider = 1; }
  message EventReactor          { Reactor reactor = 1; }
  message EventStruct           { Struct structure = 1; }
  message EventStructAttribute  { StructAttributeRecord structAttributeRecord = 1; }
  message EventStructDefender   { StructDefender structDefender = 1; }
  message EventStructType       { StructType structType = 1; }
  message EventSubstation       { Substation substation = 1; }


  message EventTime { EventTimeDetail eventTimeDetail = 1; }
  message EventTimeDetail {
    int64                         blockHeight = 1;
    google.protobuf.Timestamp     blockTime   = 2 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
  }

  message EventPermission { PermissionRecord permissionRecord = 1; }
  message EventGuildRankPermission { GuildRankPermissionRecord guildRankPermissionRecord = 1; }
  message EventGrid { GridRecord gridRecord = 1; }

  message EventProviderAddress { EventProviderAddressDetail eventProviderAddressDetail = 1;}
  message EventProviderAddressDetail { string providerId = 1; string collateralPool = 2; string earningPool = 3;}

  message EventProviderGrantGuild { EventProviderGrantGuildDetail eventProviderGrantGuildDetail = 1;}
  message EventProviderGrantGuildDetail { string providerId = 1; string guildId = 2;}

  message EventProviderRevokeGuild { EventProviderRevokeGuildDetail eventProviderRevokeGuildDetail = 1;}
  message EventProviderRevokeGuildDetail { string providerId = 1; string guildId = 2;}

  // Emitted when a provider's collateral pool could not cover revenue owed to
  // that provider. Consumer collateral has first claim on the pool, so provider
  // revenue is clamped to what remains rather than overdrawing it. A nonzero
  // shortfall means the pool is accounting for less than it should be and is
  // worth investigating; the amount stays in the provider's own pool.
  // agreementId is empty when the sweep was not tied to one agreement.
  message EventProviderRevenueShortfall { EventProviderRevenueShortfallDetail eventProviderRevenueShortfallDetail = 1;}
  message EventProviderRevenueShortfallDetail { string providerId = 1; string agreementId = 2; string denom = 3; string requested = 4; string paid = 5; string shortfall = 6;}

  message EventPlayerHalted { string playerId = 1; }
  message EventPlayerResumed { string playerId = 1; }

  message EventDelete { string objectId = 1; }

  message EventAddressAssociation { AddressAssociation addressAssociation = 1; }
  message EventAddressActivity { AddressActivity addressActivity = 1; }

  // A protocol vault is an asset owner association, never a player signing key.
  message EventVaultAddress { EventVaultAddressDetail eventVaultAddressDetail = 1; }
  message EventVaultAddressDetail {
    string ownerId = 1;
    string vaultAddress = 2;
    uint64 accountNumber = 3;
    bool accountCreated = 4;
  }

  // Migration events describe relocation, not a new stake or unbond operation.
  message EventVaultDelegationMigration {
    string ownerId = 1;
    string sourceAddress = 2;
    string vaultAddress = 3;
    string validatorAddress = 4;
    string sharesMoved = 5;
    string destinationShares = 6;
  }
  // One event per merged destination record preserves all original entry IDs,
  // amounts, shares, heights, times and hold counts without quadratic payloads.
  message EventVaultUnbondingMigration {
    string ownerId = 1;
    repeated string sourceAddresses = 2;
    cosmos.staking.v1beta1.UnbondingDelegation destination = 3 [(gogoproto.nullable) = false];
  }
  message EventVaultRedelegationMigration {
    string ownerId = 1;
    repeated string sourceAddresses = 2;
    cosmos.staking.v1beta1.Redelegation destination = 3 [(gogoproto.nullable) = false];
  }

  message EventGuildBankAddress { EventGuildBankAddressDetail eventGuildBankAddressDetail = 1;}
  message EventGuildBankAddressDetail { string guildId = 1; string bankCollateralPool = 2; string bankTokenPool = 3;}

  message EventGuildBankMint { EventGuildBankMintDetail eventGuildBankMintDetail = 1;}
  message EventGuildBankMintDetail { string guildId = 1; uint64 amountAlpha = 2; uint64 amountToken = 3; string playerId = 4;}

  // amountAlpha is the net alpha paid out to the player (after fee); fee is the
  // portion retained in the collateral pool. When fee > 0 the amountAlpha
  // semantics differ from pre-v0.21.0 (which had no fee).
  message EventGuildBankRedeem { EventGuildBankRedeemDetail eventGuildBankRedeemDetail = 1;}
  message EventGuildBankRedeemDetail { string guildId = 1; uint64 amountAlpha = 2; uint64 amountToken = 3; string playerId = 4; uint64 fee = 5;}

  message EventGuildBankConfiscateAndBurn { EventGuildBankConfiscateAndBurnDetail eventGuildBankConfiscateAndBurnDetail = 1;}
  message EventGuildBankConfiscateAndBurnDetail { string guildId = 1; uint64 amountAlpha = 2; uint64 amountToken = 3; string address = 4;}

  // amountAlpha is the gross ualpha moved into collateral; fee is the portion of
  // that alpha retained as the convert-in fee; amountToken is the token minted
  // to the player.
  message EventGuildBankConvert { EventGuildBankConvertDetail eventGuildBankConvertDetail = 1;}
  message EventGuildBankConvertDetail { string guildId = 1; uint64 amountAlpha = 2; uint64 fee = 3; uint64 amountToken = 4; string playerId = 5;}

  // Composite cross-guild convert. sourceGuildId token -> ualpha (bridgeAlpha,
  // after source out-fee) -> targetGuildId token (amountTokenOut). The two
  // underlying legs also emit EventGuildBankRedeem and EventGuildBankConvert.
  message EventGuildBankConvertToken { EventGuildBankConvertTokenDetail eventGuildBankConvertTokenDetail = 1;}
  message EventGuildBankConvertTokenDetail { string sourceGuildId = 1; string targetGuildId = 2; uint64 amountTokenIn = 3; uint64 bridgeAlpha = 4; uint64 amountTokenOut = 5; string playerId = 6;}

  message EventGuildMembershipApplication { GuildMembershipApplication guildMembershipApplication = 1; }

  message EventOreMine { EventOreMineDetail eventOreMineDetail = 1; }
  message EventOreMineDetail { string playerId = 1; string primaryAddress = 2; uint64 amount = 3;}

  message EventAlphaRefine { EventAlphaRefineDetail eventAlphaRefineDetail = 1;}
  message EventAlphaRefineDetail { string playerId = 1; string primaryAddress = 2; uint64 amount = 3; string vaultAddress = 4;}

  message EventAlphaInfuse { EventAlphaInfuseDetail eventAlphaInfuseDetail = 1;}
  message EventAlphaInfuseDetail { string playerId = 1; string primaryAddress = 2; uint64 amount = 3; string vaultAddress = 4;}

  message EventAlphaDefuse { EventAlphaDefuseDetail eventAlphaDefuseDetail = 1;}
  message EventAlphaDefuseDetail { string primaryAddress = 1; uint64 amount = 2;}

  message EventOreTheft { EventOreTheftDetail eventOreTheftDetail = 1;}
  message EventOreTheftDetail { string victimPrimaryAddress = 1; string victimPlayerId = 2; string thiefPrimaryAddress = 3; string thiefPlayerId = 4; uint64 amount = 5;}

  message EventOreMigrate { EventOreMigrateDetail eventOreMigrateDetail = 1;}
  message EventOreMigrateDetail { string playerId = 1; string primaryAddress = 2; string oldPrimaryAddress = 3; uint64 amount = 4;}

  message EventStructDefenderClear   { EventStructDefenderClearDetail structDefenderClearDetail = 1; }
  message EventStructDefenderClearDetail  { string defendingStructId = 1; }

  message EventAttack { EventAttackDetail eventAttackDetail = 1; }

  message EventAttackDetail {
    string attackerStructId = 1;

    uint64      attackerStructTypeId          = 2;
    string      attackerStructType            = 3;
    objectType  attackerStructLocationType    = 4 [(amino.dont_omitempty) = true];
    string      attackerStructLocationId      = 5;
    ambit       attackerStructOperatingAmbit  = 6 [(amino.dont_omitempty) = true];
    uint64      attackerStructSlot            = 7;

    techWeaponSystem    weaponSystem    = 8;
    techWeaponControl   weaponControl   = 9;
    techActiveWeaponry  activeWeaponry  = 10;

    repeated EventAttackShotDetail eventAttackShotDetail = 11;

    bool recoilDamageToAttacker         = 12;
    uint64 recoilDamage                 = 13;
    bool recoilDamageDestroyedAttacker  = 14;

    bool planetaryDefenseCannonDamageToAttacker         = 15;
    uint64 planetaryDefenseCannonDamage                 = 16;
    bool planetaryDefenseCannonDamageDestroyedAttacker  = 17;

    string attackerPlayerId = 18;

    uint64 attackerHealthBefore = 20;
    uint64 attackerHealthAfter = 21;
    uint64 attackerHealthMax = 22;

  }

  message EventAttackShotDetail {
    string  targetStructId = 1;
    string  targetPlayerId = 44;

    uint64      targetStructTypeId          = 2;
    string      targetStructType            = 3;
    objectType  targetStructLocationType    = 4 [(amino.dont_omitempty) = true];
    string      targetStructLocationId      = 5;
    ambit       targetStructOperatingAmbit  = 6 [(amino.dont_omitempty) = true];
    uint64      targetStructSlot            = 7;


    bool evaded                  = 8;
    techUnitDefenses evadedCause = 9;

    bool evadedByPlanetaryDefenses  = 10;
    techPlanetaryDefenses evadedByPlanetaryDefensesCause = 11;

    bool        blocked                        = 12;
    string      blockedByStructId              = 13;
    string      blockedByStructType            = 14;
    uint64      blockedByStructTypeId          = 15;
    objectType  blockedByStructLocationType    = 16 [(amino.dont_omitempty) = true];
    string      blockedByStructLocationId      = 17;
    ambit       blockedByStructOperatingAmbit  = 18 [(amino.dont_omitempty) = true];
    uint64      blockedByStructSlot            = 19;

    bool blockerDestroyed     = 20;

    repeated EventAttackDefenderCounterDetail eventAttackDefenderCounterDetail = 21;

    uint64 damageDealt                    = 22;
    uint64 damageReduction                = 23;
    techUnitDefenses damageReductionCause = 24;
    uint64 damage                         = 25;


    bool targetCountered                    = 26;
    uint64 targetCounteredDamage            = 27;
    bool targetCounterDestroyedAttacker     = 28;
    techPassiveWeaponry targetCounterPassiveWeaponry = 29 [(amino.dont_omitempty) = true];
    techWeaponSystem    targetCounterWeaponSystem    = 30 [(amino.dont_omitempty) = true];
    techWeaponControl   targetCounterWeaponControl   = 31 [(amino.dont_omitempty) = true];
    techActiveWeaponry  targetCounterActiveWeaponry  = 32 [(amino.dont_omitempty) = true];

    bool targetDestroyed = 33;

    bool postDestructionDamageToAttacker            = 34;
    uint64 postDestructionDamage                    = 35;
    bool postDestructionDamageDestroyedAttacker     = 36;
    techPassiveWeaponry postDestructionDamagePassiveWeaponry  = 37 [(amino.dont_omitempty) = true];


    uint64 targetHealthBefore  = 38;
    uint64 targetHealthAfter   = 39;
    uint64 targetHealthMax     = 40;

    uint64 blockerHealthBefore = 41;
    uint64 blockerHealthAfter  = 42;
    uint64 blockerHealthMax    = 43;

    bool armourPiercing = 45;

  }

  message EventAttackDefenderCounterDetail {
    string  counterByStructId         = 1;

    uint64              counterByStructTypeId           = 2;
    string              counterByStructType             = 3;
    objectType          counterByStructLocationType     = 4 [(amino.dont_omitempty) = true];
    string              counterByStructLocationId       = 5;
    ambit               counterByStructOperatingAmbit   = 6 [(amino.dont_omitempty) = true];
    uint64              counterByStructSlot             = 7;
    techWeaponSystem    counterByStructWeaponSystem     = 8;
    techWeaponControl   counterByStructWeaponControl    = 9;
    techActiveWeaponry  counterByStructActiveWeaponry   = 10;

    uint64  counterDamage             = 11;
    bool    counterDestroyedAttacker  = 12;

  }

  message EventRaid { EventRaidDetail eventRaidDetail = 1; }

  message EventRaidDetail {
    string      fleetId    = 1;
    string      planetId   = 2;
    raidStatus  status     = 3;
    uint64      seized_ore = 4;
  }

  message EventHashSuccess { EventHashSuccessDetail eventHashSuccessDetail = 1;}
  message EventHashSuccessDetail {
    string callerAddress    = 1;
    string category         = 2;
    uint64 difficulty       = 3;
    string objectId         = 4;
    string planetId         = 5;
  }

// Current cap activation/configuration, replayed at genesis and upgrade.
message EventReactorStakeCap {
  bool active = 1;
  uint64 capBps = 2;
  uint64 minValidators = 3;
}
