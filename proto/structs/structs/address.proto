syntax = "proto3";


package structs.structs;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "structs/structs/keys.proto";
import "amino/amino.proto";

option go_package = "structs/x/structs/types";

message AddressRecord {
  string address = 1;
  uint64 playerIndex = 2;
}

// AddressNonceRecord carries the registration-proof nonce for one address.
//
// It is a separate list from AddressRecord because the nonce deliberately
// outlives the association: it is what stops a revoked address's old
// registration proof from being replayed, so it must survive a revocation that
// removes the AddressRecord entirely.
message AddressNonceRecord {
  string address = 1;
  uint64 nonce = 2;
}

message AddressAssociation {
  string address = 1;
  uint64 playerIndex = 2;
  registrationStatus registrationStatus = 3 [(amino.dont_omitempty) = true];
}

message AddressActivity {
  string                        address     = 1;
  int64                         blockHeight = 2;
  google.protobuf.Timestamp     blockTime   = 3 [(gogoproto.nullable) = false, (gogoproto.stdtime) = true];
}

message InternalAddressAssociation {
  string address = 1;
  string objectId = 2;
}
